name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  DUO_PUBLIC_SUPABASE_URL: https://qagjowkmgsbxygydjxgo.supabase.co
  DUO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_YFBqMrSs3OsBCSS7IAsVHA_Q3PEtfQk
  DUO_PUBLIC_CLOUD_URL: https://duo-cloud-api.onrender.com

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze Flutter
        working-directory: app
        run: flutter analyze --no-fatal-infos

      - name: Test Flutter
        working-directory: app
        run: flutter test

      - name: Test local service
        run: dotnet test service/tests/DuoDesktop.Service.Tests.csproj --configuration Release

      - name: Test cloud backend
        run: dotnet test cloud/tests/DuoDesktop.Cloud.Tests.csproj --configuration Release

  linux:
    name: Build Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libx11-dev libxi-dev libxext-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 \
            libasound2t64 libpangocairo-1.0-0 libwebkit2gtk-4.1-dev \
            libmpv-dev curl unzip xz-utils git

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            PUBSPEC_VERSION=$(sed -n 's/^version: *\([0-9]*\.[0-9]*\.[0-9]*\)+[0-9]*$/\1/p' app/pubspec.yaml)
            if [[ "${VERSION}" != "${PUBSPEC_VERSION}" ]]; then
              echo "Tag ${GITHUB_REF_NAME} does not match app/pubspec.yaml version ${PUBSPEC_VERSION}" >&2
              exit 1
            fi
          else
            BASE=$(sed -n 's/^version: *\([0-9]*\.[0-9]*\)\..*/\1/p' app/pubspec.yaml)
            VERSION="${BASE}.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Build Linux release
        working-directory: app
        run: |
          flutter build linux --release -v \
            --dart-define=SUPABASE_URL="$DUO_PUBLIC_SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$DUO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=DUO_CLOUD_URL="$DUO_PUBLIC_CLOUD_URL"

      - name: Package Linux artifact
        id: package
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          BUNDLE="app/build/linux/x64/release/bundle"
          OUT_DIR="artifacts"
          mkdir -p "${OUT_DIR}"

          if [[ -x "app/scripts/build-deb.sh" ]]; then
            echo "Using app/scripts/build-deb.sh"
            DUO_DESKTOP_VERSION="${VERSION}" bash app/scripts/build-deb.sh
            DEB=$(find . -name "duo-desktop_*_amd64.deb" -type f | head -n1)
            if [[ -z "${DEB}" ]]; then
              echo "build-deb.sh did not produce a .deb" >&2
              exit 1
            fi
            cp "${DEB}" "${OUT_DIR}/"
            ARTIFACT_NAME=$(basename "${DEB}")
          else
            echo "app/scripts/build-deb.sh not found; packaging Flutter bundle as zip"
            ARTIFACT_NAME="DuoDesktop-${VERSION}-linux-x64.zip"
            (cd "${BUNDLE}" && zip -r "${GITHUB_WORKSPACE}/${OUT_DIR}/${ARTIFACT_NAME}" .)
          fi

          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          ls -lh "${OUT_DIR}/"

      # DuoLauncher consumes a platform-specific payload, not the .deb.  The
      # package above contains the same seed under this path, so create the
      # update ZIP from it and publish the manifest it queries on every start.
      - name: Package Linux launcher update
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          TAG="v${VERSION}"
          SEED="app/build/linux-deb/root/usr/lib/duo-desktop/seed"
          OUT_DIR="artifacts/launcher-update"
          UPDATE_NAME="DuoDesktop-${VERSION}-linux-x64-update.zip"

          for required in \
            "${SEED}/versions/${VERSION}/app/duo_desktop" \
            "${SEED}/versions/${VERSION}/app/lib/libflutter_linux_gtk.so" \
            "${SEED}/versions/${VERSION}/service/DuoDesktop.Service"; do
            [[ -f "${required}" ]] || { echo "Update payload missing ${required}" >&2; exit 1; }
          done

          mkdir -p "${OUT_DIR}"
          (cd "${SEED}/versions/${VERSION}" && zip -r "${GITHUB_WORKSPACE}/${OUT_DIR}/${UPDATE_NAME}" app service)
          SHA256=$(sha256sum "${OUT_DIR}/${UPDATE_NAME}" | awk '{print $1}')
          cat > "${OUT_DIR}/latest-linux.json" <<EOF
          {
            "version": "${VERSION}",
            "channel": "beta",
            "url": "https://github.com/${{ github.repository }}/releases/download/${TAG}/${UPDATE_NAME}",
            "sha256": "${SHA256}",
            "minimumLauncherVersion": "1.0.0",
            "mandatory": false
          }
          EOF
          cat "${OUT_DIR}/latest-linux.json"

      # The .deb is one installation path, but publish a complete portable
      # layout too.  It mirrors the Windows portable launcher: users extract
      # it once, always run DuoLauncher, and receive the smaller update ZIPs.
      - name: Package Linux portable launcher
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          SEED="app/build/linux-deb/root/usr/lib/duo-desktop/seed"
          OUT_DIR="artifacts/launcher-update"
          PORTABLE="${OUT_DIR}/DuoDesktop-beta-linux-x64"
          ARCHIVE="${OUT_DIR}/DuoDesktop-${VERSION}-linux-x64-portable.zip"

          for required in \
            "${SEED}/DuoLauncher" \
            "${SEED}/launcher-config.json" \
            "${SEED}/current.json" \
            "${SEED}/versions/${VERSION}/app/duo_desktop" \
            "${SEED}/versions/${VERSION}/service/DuoDesktop.Service"; do
            [[ -f "${required}" ]] || { echo "Portable launcher missing ${required}" >&2; exit 1; }
          done

          rm -rf "${PORTABLE}"
          mkdir -p "${PORTABLE}"
          cp -a "${SEED}/DuoLauncher" "${SEED}/launcher-config.json" "${SEED}/current.json" "${PORTABLE}/"
          cp -a "${SEED}/versions" "${PORTABLE}/versions"
          (cd "${PORTABLE}" && zip -r "${GITHUB_WORKSPACE}/${ARCHIVE}" .)
          ls -lh "${ARCHIVE}"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifact
          path: artifacts/${{ steps.package.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux launcher update
        uses: actions/upload-artifact@v4
        with:
          name: linux-launcher-update
          path: artifacts/launcher-update/*
          if-no-files-found: error
          retention-days: 14

    outputs:
      version: ${{ steps.ver.outputs.version }}

  windows:
    name: Build Windows portable
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Generate Windows runner when absent
        shell: pwsh
        working-directory: app
        run: |
          if (-not (Test-Path "windows")) {
            flutter create --platforms=windows .
          }

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # Every push to main gets a strictly increasing version so
            # DuoLauncher (which compares SemVer) picks it up as an update.
            BASE=$(sed -n 's/^version: *\([0-9]*\.[0-9]*\)\..*/\1/p' app/pubspec.yaml)
            VERSION="${BASE}.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Build Windows release
        working-directory: app
        shell: pwsh
        run: |
          flutter build windows --release -v `
            --dart-define=SUPABASE_URL="$env:DUO_PUBLIC_SUPABASE_URL" `
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$env:DUO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" `
            --dart-define=DUO_CLOUD_URL="$env:DUO_PUBLIC_CLOUD_URL"

      - name: Publish local service self-contained
        shell: pwsh
        run: |
          dotnet publish .\service\DuoDesktop.Service.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -o .\artifacts\service

      - name: Package Windows portable artifact
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.ver.outputs.version }}"
          $bundle = "app\build\windows\x64\runner\Release"
          $stage = "artifacts\DuoDesktop-${version}-windows-x64"
          $zip = "artifacts\DuoDesktop-${version}-windows-x64.zip"

          if (-not (Test-Path $bundle)) {
            throw "Windows Release bundle not found at $bundle"
          }

          New-Item -ItemType Directory -Force -Path "$stage\app" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage\service" | Out-Null

          Copy-Item "$bundle\*" "$stage\app" -Recurse -Force
          Copy-Item "artifacts\service\*" "$stage\service" -Recurse -Force
          Copy-Item "scripts\windows\start-duo.ps1" "$stage\start-duo.ps1" -Force
          Copy-Item "scripts\windows\Iniciar Duo Desktop.cmd" "$stage\Iniciar Duo Desktop.cmd" -Force
          Copy-Item "scripts\windows\README-PRUEBA.txt" "$stage\README-PRUEBA.txt" -Force
          Set-Content -Path "$stage\VERSION.txt" -Value $version -Encoding UTF8

          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -Force

          $size = (Get-Item $zip).Length
          if ($size -lt 1000000) {
            throw "Windows zip is unexpectedly small: $size bytes"
          }

          "artifact_name=DuoDesktop-${version}-windows-x64.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Get-ChildItem artifacts

      # DuoLauncher update payload: a zip with app\ and service\ at its root,
      # plus latest.json, which the launcher reads from the latest release.
      - name: Package DuoLauncher update
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.ver.outputs.version }}"
          $tag = "v$version"
          $stage = "artifacts\DuoDesktop-${version}-windows-x64"
          $updateName = "DuoDesktop-${version}-windows-x64-update.zip"
          $update = "artifacts\launcher-update\$updateName"
          New-Item -ItemType Directory -Force -Path "artifacts\launcher-update" | Out-Null

          foreach ($required in "app\duo_desktop.exe", "app\flutter_windows.dll", "app\libcef.dll", "service\DuoDesktop.Service.exe") {
            if (-not (Test-Path "$stage\$required")) { throw "Update payload missing $required" }
          }
          Compress-Archive -Path "$stage\app", "$stage\service" -DestinationPath $update -Force

          $sha = (Get-FileHash $update -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            version = $version
            channel = "beta"
            url = "https://github.com/${{ github.repository }}/releases/download/$tag/$updateName"
            sha256 = $sha
            minimumLauncherVersion = "1.0.0"
            mandatory = $false
          }
          $manifest | ConvertTo-Json | Set-Content "artifacts\launcher-update\latest.json" -Encoding utf8NoBOM
          Get-Content "artifacts\launcher-update\latest.json"

      # DuoLauncher.exe (with the Duo icon) is not built from this repo; it is
      # kept as an asset of the launcher-v1.0.0 pre-release.
      - name: Build installer and portable launcher folder
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.ver.outputs.version }}"
          $stage = "artifacts\DuoDesktop-${version}-windows-x64"
          $portable = "artifacts\portable\DuoDesktop-beta-windows-x64"
          $out = "artifacts\launcher-update"

          gh release download launcher-v1.0.0 --repo "${{ github.repository }}" --pattern DuoLauncher.exe --dir artifacts\launcher-bin

          New-Item -ItemType Directory -Force -Path "$portable\versions\$version" | Out-Null
          Copy-Item "$stage\app", "$stage\service" "$portable\versions\$version" -Recurse
          Copy-Item artifacts\launcher-bin\DuoLauncher.exe $portable
          Copy-Item installer\windows\launcher-config.json, installer\windows\duo.ico, installer\windows\LEEME.txt $portable
          $launcherConfig = Get-Content "$portable\launcher-config.json" -Raw | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($launcherConfig.duoProject)) {
            throw "launcher-config.json must declare duoProject so installed copies select a board."
          }
          @{ version = $version } | ConvertTo-Json | Set-Content "$portable\current.json" -Encoding utf8NoBOM

          Compress-Archive -Path $portable -DestinationPath "$out\DuoDesktop-${version}-windows-x64-portable.zip" -Force

          choco install innosetup --no-progress -y
          $iscc = (Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc /Q "/DAppVersion=$version" "/DSourceDir=$((Resolve-Path $portable).Path)" "/DOutputDir=$((Resolve-Path $out).Path)" installer\windows\duo-desktop.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          Get-ChildItem $out

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: artifacts/DuoDesktop-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload DuoLauncher update
        uses: actions/upload-artifact@v4
        with:
          name: launcher-update
          path: artifacts/launcher-update/*
          if-no-files-found: error
          retention-days: 14

    outputs:
      version: ${{ steps.ver.outputs.version }}

  publish-windows-update:
    name: Publish desktop launcher updates
    needs: [validate, linux, windows]
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main' && success()

    steps:
      - name: Verify Duo Cloud health
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 --retry-all-errors \
            "$DUO_PUBLIC_CLOUD_URL/health"

      - name: Download DuoLauncher update
        uses: actions/download-artifact@v4
        with:
          name: launcher-update
          path: launcher-update

      - name: Download Linux launcher update
        uses: actions/download-artifact@v4
        with:
          name: linux-launcher-update
          path: linux-launcher-update

      - name: Verify matching platform versions
        run: |
          test "${{ needs.linux.outputs.version }}" = "${{ needs.windows.outputs.version }}"

      # Non-prerelease so /releases/latest (what DuoLauncher queries) returns it.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.windows.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Duo Desktop ${{ needs.windows.outputs.version }} (beta)
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            launcher-update/*
            linux-launcher-update/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Publish GitHub Release
    needs: [validate, linux, windows]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/') && success()

    steps:
      - name: Checkout (for release notes context)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-artifact
          path: release-assets

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-artifact
          path: release-assets

      - name: Download Linux launcher update
        uses: actions/download-artifact@v4
        with:
          name: linux-launcher-update
          path: release-assets

      - name: Generate checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          sha256sum * > checksums.txt
          cat checksums.txt
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Duo Desktop ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
