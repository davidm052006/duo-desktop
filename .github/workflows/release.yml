name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write


jobs:
  linux:
    name: Build Linux
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libx11-dev libxi-dev libxext-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 \
            libasound2t64 libpangocairo-1.0-0 \
            curl unzip xz-utils git

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos

      - name: Extract version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Build Linux release
        working-directory: app
        run: flutter build linux --release -v

      - name: Package Linux artifact
        id: package
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          BUNDLE="app/build/linux/x64/release/bundle"
          OUT_DIR="artifacts"
          mkdir -p "${OUT_DIR}"

          if [[ -x "app/scripts/build-deb.sh" ]]; then
            echo "Using app/scripts/build-deb.sh"
            bash app/scripts/build-deb.sh
            DEB=$(find . -name "duo-desktop_*_amd64.deb" -type f | head -n1)
            if [[ -z "${DEB}" ]]; then
              echo "build-deb.sh did not produce a .deb" >&2
              exit 1
            fi
            cp "${DEB}" "${OUT_DIR}/"
            ARTIFACT_NAME=$(basename "${DEB}")
          else
            echo "app/scripts/build-deb.sh not found; packaging Flutter bundle as zip"
            ARTIFACT_NAME="DuoDesktop-${VERSION}-linux-x64.zip"
            (cd "${BUNDLE}" && zip -r "${GITHUB_WORKSPACE}/${OUT_DIR}/${ARTIFACT_NAME}" .)
          fi

          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          ls -lh "${OUT_DIR}/"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifact
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Build Windows portable
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Generate Windows runner when absent
        shell: pwsh
        working-directory: app
        run: |
          if (-not (Test-Path "windows")) {
            flutter create --platforms=windows .
          }

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos

      - name: Extract version from tag
        id: ver
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Build Windows release
        working-directory: app
        shell: pwsh
        run: |
          flutter build windows --release -v

      - name: Publish local service self-contained
        shell: pwsh
        run: |
          dotnet publish .\service\DuoDesktop.Service.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -o .\artifacts\service

      - name: Package Windows portable artifact
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.ver.outputs.version }}"
          $bundle = "app\build\windows\x64\runner\Release"
          $stage = "artifacts\DuoDesktop-${version}-windows-x64"
          $zip = "artifacts\DuoDesktop-${version}-windows-x64.zip"

          if (-not (Test-Path $bundle)) {
            throw "Windows Release bundle not found at $bundle"
          }

          New-Item -ItemType Directory -Force -Path "$stage\app" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage\service" | Out-Null

          Copy-Item "$bundle\*" "$stage\app" -Recurse -Force
          Copy-Item "artifacts\service\*" "$stage\service" -Recurse -Force
          Copy-Item "scripts\windows\start-duo.ps1" "$stage\start-duo.ps1" -Force
          Copy-Item "scripts\windows\Iniciar Duo Desktop.cmd" "$stage\Iniciar Duo Desktop.cmd" -Force
          Copy-Item "scripts\windows\README-PRUEBA.txt" "$stage\README-PRUEBA.txt" -Force
          Set-Content -Path "$stage\VERSION.txt" -Value $version -Encoding UTF8

          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -Force

          $size = (Get-Item $zip).Length
          if ($size -lt 1000000) {
            throw "Windows zip is unexpectedly small: $size bytes"
          }

          "artifact_name=DuoDesktop-${version}-windows-x64.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Get-ChildItem artifacts

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: artifacts/DuoDesktop-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/') && success()

    steps:
      - name: Checkout (for release notes context)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-artifact
          path: release-assets

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-artifact
          path: release-assets

      - name: Generate checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          sha256sum * > checksums.txt
          cat checksums.txt
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Duo Desktop ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
